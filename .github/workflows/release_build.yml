name: ReleaseBuild

on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for NuGet trusted publishing (OIDC)
      id-token: write
    defaults:
      run:
        working-directory: 'src'

    steps:
    - uses: actions/checkout@v4

    # Uses the latest version of dotnet since we don't specific a version here
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
        
      # Restore nuget packages
    - name: Restore dependencies
      run: dotnet restore
      
      # build the source
    - name: Build
      run: dotnet build --no-restore --configuration Release      
      
      # Run the unit tests
    - name: Unit Tests
      run: dotnet test GoogleSheetsWrapper.Tests.csproj --no-build --verbosity normal --configuration Release
      working-directory: 'src/GoogleSheetsWrapper.Tests'

      # Run the integration tests
    - name: Integration Tests
      run: dotnet test GoogleSheetsWrapper.IntegrationTests.csproj --no-build --verbosity normal --configuration Release
      working-directory: 'src/GoogleSheetsWrapper.IntegrationTests'
      env:
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        GOOGLE_JSON_CREDS: ${{ secrets.GOOGLE_JSON_CREDS }}
      
      # Login to Nuget.org using trusted publishing (OIDC) to get a short lived API key
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

      # Publish the Nuget file to Nuget.org
    - name: PushNuget
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
